name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  libs:
    name: Build & Test (libs)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: true
      NX_DAEMON: false
      NX_SKIP_NX_CACHE: false
      # hard-disable Nx Cloud in CI
      NX_CLOUD: 'false'
      NX_DISABLE_CLOUD: 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js >=22.22.3 with npm cache
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Angular 22's engines field requires ^22.22.3 || ^24.15.0 || >=26.0.0;
          # pinned explicitly so an old runner image fails loudly instead of
          # silently installing an Angular that won't run.
          node-version: '>=22.22.3'
          cache: npm

      - name: Install deps
        run: |
          if [ -f package-lock.json ]; then npm ci --prefer-offline --no-audit --fund=false --legacy-peer-deps; else npm install --prefer-offline --no-audit --fund=false --legacy-peer-deps; fi

      # In case Nx still picks up nxCloudId from nx.json, strip it before running
      - name: Disable Nx Cloud via nx.json patch
        run: |
          node -e "const fs=require('fs');const p='./nx.json';const j=JSON.parse(fs.readFileSync(p,'utf8'));if(j.nxCloudId){delete j.nxCloudId;fs.writeFileSync(p,JSON.stringify(j,null,2));console.log('Removed nxCloudId from nx.json');}else{console.log('nxCloudId not present');}"

      - name: Lint all projects
        run: npx nx run-many -t lint --all --skip-nx-cache=false

      - name: Build Angular libs (prod)
        run: npx nx run-many -t build -p=runtime-i18n,runtime-i18n-angular,runtime-i18n-material,runtime-i18n-primeng --configuration=production --skip-nx-cache=false

      - name: Build tooling libs
        run: npx nx run-many -t build -p=runtime-i18n-schematics,cli --skip-nx-cache=false

      - name: Test libs
        run: npx nx run-many -t test -p=runtime-i18n,runtime-i18n-angular,runtime-i18n-material,runtime-i18n-primeng,runtime-i18n-schematics --configuration=ci --runInBand --skip-nx-cache=false

      - name: Test tooling
        run: npx nx test cli --runInBand --skip-nx-cache=false
